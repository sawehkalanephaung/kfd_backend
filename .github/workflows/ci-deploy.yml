# Build, test, and deploy the backend to Elastic Beanstalk.
#
# Replaces the previous manual flow (`./mvnw package` on a laptop, then
# `eb deploy`). That flow uploaded whatever jar happened to be sitting in
# `target/`, with no link to a commit — a stale jar could be, and was, deployed
# while reporting success. Here the jar is built from the checked-out commit and
# is the only thing that can reach production.
#
# Deploying is gated on the `production` GitHub Environment. Configure it with
# required reviewers, or this becomes an automatic prod deploy — see
# docs/ci-cd-setup.md.

name: CI / Deploy

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  EB_APPLICATION: kfd-backend
  EB_ENVIRONMENT: kfd-backend-prod
  HEALTH_PATH: /api/v1/public/health
  # EB's per-region, per-account artifact bucket. Elastic Beanstalk creates this
  # automatically the first time anyone runs `eb deploy` or calls
  # CreateStorageLocation in this account/region, and it does not change —
  # confirmed present as elasticbeanstalk-ap-southeast-1-119306256305. Referenced
  # directly rather than resolved by calling CreateStorageLocation, to avoid an
  # extra API call — not to avoid s3:CreateBucket: UpdateEnvironment performs the
  # same "ensure the bucket exists" check itself, using the caller's own
  # credentials, so the deploy IAM user needs s3:CreateBucket regardless (see
  # docs/ci-cd-setup.md — scoped to only this bucket ARN, which is idempotent
  # against a bucket the account already owns). If this ever needs to move to a
  # different account or region, create the bucket with
  # `aws elasticbeanstalk create-storage-location` under a broader identity once
  # and update this value.
  EB_S3_BUCKET: elasticbeanstalk-ap-southeast-1-119306256305

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    # KfdBackendApplicationTests is a @SpringBootTest with no H2 or Testcontainers
    # fallback: it boots the real context and runs all Flyway migrations. Those
    # migrations use Postgres-specific types (jsonb), so an embedded database is
    # not a substitute — CI needs a real Postgres.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        # Supplied as environment variables rather than -D so they reach the
        # forked Surefire JVM, and so the committed application.properties is
        # overridden without being edited.
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/postgres
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # The approval gate. Requires a `production` Environment with required
    # reviewers configured on the repository.
    environment:
      name: production
      url: ${{ steps.env-url.outputs.url }}

    # Never let two deploys race for the same environment.
    # `env` is not available to job-level concurrency, so the environment name
    # is repeated here rather than referenced.
    concurrency:
      group: deploy-kfd-backend-prod
      cancel-in-progress: false

    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: artifact

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish application version
        id: publish
        env:
          # Quoted into the environment rather than interpolated into the script.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # EB serves the Java SE platform a bare jar today (see
          # .elasticbeanstalk/config.yml `deploy.artifact`). Keep it identical —
          # switching to a zip bundle would start applying .ebextensions/Procfile
          # that are not part of the current deploy, changing runtime behaviour.
          JAR=$(ls artifact/*.jar | head -1)
          echo "Deploying $(basename "$JAR")"

          VERSION="gh-${{ github.run_number }}-$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          KEY="${EB_APPLICATION}/${VERSION}.jar"

          aws s3 cp "$JAR" "s3://${EB_S3_BUCKET}/${KEY}"

          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION" \
            --version-label "$VERSION" \
            --source-bundle "S3Bucket=${EB_S3_BUCKET},S3Key=${KEY}" \
            --description "$(printf '%s' "${COMMIT_MESSAGE:-manual dispatch}" | tr '\n' ' ' | cut -c1-190)" \
            --no-auto-create-application

      - name: Deploy and wait for the environment to stabilise
        run: |
          set -euo pipefail
          aws elasticbeanstalk update-environment \
            --environment-name "$EB_ENVIRONMENT" \
            --version-label "${{ steps.publish.outputs.version }}"

          # Fails the job if the environment does not return to Ready.
          aws elasticbeanstalk wait environment-updated \
            --environment-names "$EB_ENVIRONMENT"

      - name: Report environment URL
        id: env-url
        run: |
          set -euo pipefail
          CNAME=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].CNAME" --output text)
          echo "url=http://${CNAME}" >> "$GITHUB_OUTPUT"
          echo "cname=${CNAME}" >> "$GITHUB_OUTPUT"

      - name: Verify deployed version and health
        run: |
          set -euo pipefail
          EXPECTED="${{ steps.publish.outputs.version }}"

          LIVE=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].VersionLabel" --output text)
          HEALTH=$(aws elasticbeanstalk describe-environments \
            --environment-names "$EB_ENVIRONMENT" \
            --query "Environments[0].Health" --output text)

          echo "running version: $LIVE (expected $EXPECTED)"
          echo "environment health: $HEALTH"

          # The check the old manual flow could not make: prove the code now
          # running is the code that was just built.
          [ "$LIVE" = "$EXPECTED" ] || { echo "::error::Deployed version is $LIVE, expected $EXPECTED"; exit 1; }
          [ "$HEALTH" != "Red" ] || { echo "::error::Environment health is Red"; exit 1; }

          URL="http://${{ steps.env-url.outputs.cname }}${HEALTH_PATH}"
          for i in $(seq 1 10); do
            CODE=$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo "000")
            echo "  health probe $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::$URL never returned 200"
          exit 1
