services:
  db:
    image: postgres:16-alpine
    container_name: kfd-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: passwordkfd
    ports:
      - "5432:5432"
    volumes:
      - kfd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kfd-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: passwordkfd
      # ─── Resend Email API ───
      RESEND_API_KEY: re_YOUR_API_KEY_HERE
      APP_MAIL_RECIPIENT: info@kfd.org
    depends_on:
      db:
        condition: service_healthy

volumes:
  kfd_postgres_data:
