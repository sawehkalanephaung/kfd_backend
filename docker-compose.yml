services:
  db:
    image: postgres:16-alpine
    container_name: kfd-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - kfd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: kfd-backend
    ports:
      - "8080:8080"
    volumes:
      - kfd_uploads_data:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # ─── Resend Email API ───
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_TO: ${EMAIL_TO}
      APP_MAIL_RECIPIENT: ${EMAIL_TO}
      # ─── JWT ───
      # Optional locally (an ephemeral key is generated); required in production.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  kfd_postgres_data:
  kfd_uploads_data:
