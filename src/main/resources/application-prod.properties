# ─── Server ───
# Port required for Beanstalk Nginx Proxy routing
server.port=5000

# ─── AWS ───
# Import configuration from AWS Systems Manager Parameter Store
# 'optional:' means the app will still start even if SSM is unreachable.
# All critical secrets are already injected via Elastic Beanstalk environment variables.
spring.config.import=optional:aws-parameterstore:/config/kfd_prod/

# Use EC2 instance profile credentials (IAM Role attached to EB instance)
spring.cloud.aws.credentials.instance-profile=true
spring.cloud.aws.region.static=ap-southeast-1

# ─── S3 Configuration ───
aws.s3.bucket-name=kfd-media-uploads
aws.s3.region=ap-southeast-1

# ─── CORS Configuration ───
# Set via Elastic Beanstalk environment variable: APP_CORS_ALLOWED_ORIGINS
# Example: https://kfdofficial.org,https://www.kfdofficial.org
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
