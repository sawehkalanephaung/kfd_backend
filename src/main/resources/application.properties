spring.application.name=kfd_backend

# ─── Active Profile ───
# 'local' activates LocalStorageServiceImpl (disk-based uploads).
# 'prod'  activates S3StorageServiceImpl — set by Elastic Beanstalk.
spring.profiles.active=local

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=passwordkfd
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
# spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=true

# Flyway Configuration
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# Tell Spring to fetch dynamic parameters from AWS Parameter Store
spring.config.import=optional:aws-parameterstore:/config/kfd_prod/

# Flyway Configuration (New)
spring.flyway.enabled=true
# Prevents crashes if you are migrating an existing remote database
spring.flyway.baseline-on-migrate=true 

# Hibernate / JPA configuration (New)
# IMPORTANT: Use 'validate' or 'none' when using Flyway. NEVER use 'update' or 'create-drop' in production, or Hibernate will fight Flyway for control.
spring.jpa.hibernate.ddl-auto=validate

# File Upload Configuration (15MB Limit)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ─── Resend Email API Configuration ───
resend.api.key=${RESEND_API_KEY:dummy_key_for_local_dev}
app.mail.recipient=${EMAIL_TO:dummy@test.com}

# ─── Logging Configuration ───
# Routes to logback-spring.xml for structured rolling logs + dedicated audit log file
logging.config=classpath:logback-spring.xml

# ─── CORS Configuration ───
# Comma-separated list of allowed frontend origins.
# Override in production via environment variable: APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:3000

# ─── JWT Signing Key ───
# NEVER hardcode a value here. This file is public; a signing key committed to it
# lets anyone forge an admin token. Supply it via the JWT_SECRET_KEY environment
# variable (Elastic Beanstalk environment property in production).
#
#   generate:  openssl rand -base64 32
#
# If unset, the app generates an ephemeral key on the local/dev profile and
# refuses to start on any other profile.
application.security.jwt.secret-key=${JWT_SECRET_KEY:}

# ─── AWS Region (needed by Spring Cloud AWS even in local mode) ───
spring.cloud.aws.region.static=ap-southeast-1
spring.cloud.aws.credentials.instance-profile=false

# ─── S3 Configuration (overridden in prod by application-prod.properties) ───
aws.s3.bucket-name=kfd-media-uploads
aws.s3.region=ap-southeast-1
