spring.application.name=kfd_backend

# PostgreSQL Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=passwordkfd
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# File Upload Configuration (15MB Limit)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ─── Resend Email API Configuration ───
resend.api.key=${RESEND_API_KEY:dummy_key_for_local_dev}
app.mail.recipient=${EMAIL_TO:dummy@test.com}

# ─── Logging Configuration ───
# Routes to logback-spring.xml for structured rolling logs + dedicated audit log file
logging.config=classpath:logback-spring.xml

# ─── CORS Configuration ───
# Comma-separated list of allowed frontend origins.
# Override in production via environment variable: APP_CORS_ALLOWED_ORIGINS
app.cors.allowed-origins=http://localhost:3000
